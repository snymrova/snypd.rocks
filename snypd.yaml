# snypd.rocks — the whole site config. Every key not named here comes from @snypd/spec;
# `snypd://config` is the merged result with a comment saying where each value came from.
snypd: 1

site:
  name: "snypd.rocks"
  url: "https://snypd.rocks" # placeholder — the feed, sitemap and JSON-LD are absolute, so publishing needs the real one

theme:
  use: editorial
types:
  author:
    layout: author

# Plugins (docs/10 §4.8): bundled, no install. `autolink` links the first mention of a category or tag to its
# archive; `indexnow` emits /indexnow/<key>.txt and tells Bing, Yandex, Seznam and Naver which pages a push
# changed. The key is a claim, not a secret. Both need a release that carries them (0.1.4+) on the host's build.
plugins:
  - autolink
  - indexnow: { key: 5ecb670b62f4978b94154dc09878ea1e }

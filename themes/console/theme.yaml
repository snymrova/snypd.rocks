# console — snypd.rocks's own theme: the terminal look (docs/24, decision 202). The site in the window
# the agent lives in.
#
# Site-local, not bundled: this directory lives in the site's `themes/`, the loader finds it first
# (site.ts), and `extends: technical` walks up to the bundled one by name — so the title-bar masthead
# with its tagline and `src` link, the contents list, the tables and code that take the width they need,
# the 44 rem measure, are inherited, and this file adds what the look needs: one mono face for
# everything, a dark scheme committed, the window frame around the hero, the prompt and its caret, the
# ledger as `git log --oneline` rows (also the entry list), the status-line footer, a front page that is
# a transcript. Held to the same gate: `snypd check theme console --root=sites/snypd.rocks`, 18 rules.
#
# No `font:` — the system mono stack is the face (docs/24 §9 · 3), so the font budget is 0 and met.
theme: console
version: 0.1.0
spec: ^1
extends: technical
css: ./theme.css
# Arrays replace up the chain (theme.ts): the six, `home`, and the three of this theme's own.
layouts: [post, page, index, term, author, home, release, log, log-index]
# Parts merge up the chain, so technical's masthead and contents list stand. The ledger is registered as
# `entries` too: `/posts/`, a term page and an author page are the same rows as the log.
parts:
  ledger:  ./parts/ledger.tsx
  entries: ./parts/ledger.tsx
  footer:  ./parts/footer.tsx
# Settings replace up the chain too, so technical's eight are restated, then the two of this theme's own:
# the right half of the status line, and whether the hero's caret blinks and its subtitle types in.
settings:
  - { id: logo,       type: image,     label: Logo,             group: Identity, info: "Site-relative url of an image — put the file in content/media/. Without one the masthead sets the site's name in mono." }
  - { id: tagline,    type: text,      label: Tagline,          group: Identity, info: "One line beside the name. Defaults to the site's own description." }
  - { id: repo,       type: url,       label: "Source repository", group: Identity, info: "Linked from the masthead as `src`." }
  - { id: tocDepth,   type: select,    label: "Contents depth", group: Posts,    default: "3", options: ["2", "3", "0"], info: "How deep the contents list on a post goes: 2 is section headings only, 3 includes their sub-headings, 0 turns it off." }
  - { id: showDates,  type: boolean,   label: "Show dates",     group: Posts,    default: true,  info: "Off hides the date on the byline and in every list." }
  - { id: dateFormat, type: select,    label: "Date format",    group: Posts,    default: iso, options: [iso, long, short], info: "2026-09-12 · 12 September 2026 · 12 Sep 2026. English month names; the <time> element always carries the machine-readable date." }
  - { id: footerNote, type: richtext,  label: "Footer note",    group: Footer,   info: "The left half of the status line at the foot of every page — a licence, a colophon, a copyright. Markdown." }
  - { id: statusNote, type: richtext,  label: "Status note",    group: Footer,   info: "The right half of the status line — `0 KB JS · 18 rules`. A claim the site makes; the bench page is where it is proven. Markdown." }
  - { id: social,     type: link_list, label: "Social links",   group: Footer,   info: "[{ label, url }] in the footer. Links off this site, so they are urls and not refs — a menu of your own pages is content/nav/footer.yaml." }
  - { id: tldrLabel,  type: text,      label: "Summary label", group: Posts,   default: "In short", info: "The word above a `tldr` block. A page may still set its own `label`." }
  - { id: caret,      type: boolean,   label: Caret,            group: "Front page", default: true, info: "The block caret blinking after the headline and the subtitle typing in once, on the front page. Off gives the look without the two motions; a reader's reduced-motion setting and the motion control stop them regardless." }

personality: >-
  The terminal look. One mono face at one size; a warm near-black; the front page is a window with a
  prompt for a headline, every section a turn, the log as `git log --oneline` rows with the kind
  bracketed and coloured; a status line for a footer. Dark, committed. Zero JS, no webfont.

# Tokens: what differs from technical (docs/24 §4). Short form overrides the parent's default and keeps
# its description; `size.display` is this theme's own and is declared in full.
tokens:
  color.scheme:    dark
  color.bg:        "light-dark(#f4f1ec, #141312)"
  color.surface:   "light-dark(#ebe7e0, #1b1b1b)"
  color.text:      "light-dark(#1a1917, #ece8e1)"
  color.muted:     "light-dark(#67625a, #a09a90)"
  color.accent:    "light-dark(#b8410f, #ff8a4c)"
  color.on-accent: "light-dark(#f4f1ec, #141312)"
  color.border:    "light-dark(#dcd7ce, #2b2927)"
  # The series: 1 is the refusal's red, 2 the decision's blue, 3 the caret's amber (also *measured*),
  # 5 the status line's green (also *shipped*). The ledger colours a kind from these and nothing else (205).
  color.viz.1:           "light-dark(#b3382b, #f2705c)"
  color.viz.2:           "light-dark(#1f5f8b, #7fb8e6)"
  color.viz.3:           "light-dark(#8a6d00, #e0b84a)"
  color.viz.4:           "light-dark(#4b4b8f, #a8a8e8)"
  color.viz.5:           "light-dark(#3f6b3a, #9bcf8f)"
  color.viz.6:           "light-dark(#8b3f68, #e59bc4)"
  color.viz.axis:        "light-dark(#67625a, #a09a90)"
  color.viz.grid:        "light-dark(#e6e1d8, #242221)"
  color.viz.tick:        "light-dark(#67625a, #a09a90)"
  color.viz.label:       "light-dark(#1a1917, #ece8e1)"
  color.viz.edge:        "light-dark(#8c877e, #6e6a64)"
  color.viz.node:        "light-dark(#ebe7e0, #1b1b1b)"
  color.viz.node-stroke: "light-dark(#c9c3b8, #3a3735)"
  font.body:     "var(--font-mono)"
  font.heading:  "var(--font-mono)"
  font.ui:       "var(--font-mono)"
  size.body:     "clamp(0.95rem, 0.9rem + 0.28vw, 1.0375rem)"
  size.h1:       "clamp(1.7rem, 1.3rem + 1.8vw, 2.6rem)"
  size.h2:       "clamp(1.4rem, 1.15rem + 1.1vw, 2.1rem)"
  size.display:  { default: "clamp(2rem, 1rem + 4.2vw, 4.5rem)", customisable: true, kind: size, description: "The front page's headline — the prompt. Mono sets wide, so this is smaller than a sans display size: three lines of twelve characters on a desktop, not four." }
  leading.tight: "1.1"
  radius:        "4px"

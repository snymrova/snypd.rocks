# Cloudflare Workers, serving static assets. `snypd build` writes dist/; `wrangler deploy` uploads it.
# Nothing here talks to an API — snypd writes files and git, and the host builds on push (docs/07 §3b).
#
# The build command, for the dashboard's "Build command" field (Workers Builds runs it before deploy):
#     npx -y @snypd/cli@latest build
# Unpinned on purpose (decision 219): this is snypd's own site, built by whatever snypd last shipped.
# A site `init --deploy` writes is pinned (decision 68).
name = "snypd-rocks"
compatibility_date = "2026-08-31"

[assets]
directory = "./dist"
# A miss serves dist/404.html with a 404 status — the site's own not-found page, which every build writes.
not_found_handling = "404-page"
